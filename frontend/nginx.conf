server {
    listen 80;
    server_name libertyheartsurgery.com www.libertyheartsurgery.com;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name libertyheartsurgery.com www.libertyheartsurgery.com;

    # SSL Certificate Paths (mapped from host)
    ssl_certificate /etc/letsencrypt/live/libertyheartsurgery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/libertyheartsurgery.com/privkey.pem;

    # Serve built React frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy H2 SQL Console calls
    location /h2-console {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
